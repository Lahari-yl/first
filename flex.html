<!DOCTYPE html>
<html>
    <head>
        <title>flex box</title>
        <style>
            .container{
                display: flex;
                gap:20px;
                justify-content: center;
                align-items:center;
                height: 100px;
                width:400px;
                border: 1px solid black;
                text-align: center;
                background-color: aqua;
            }
            .box{
                width: 100px;
                height: 50px;
                background-color: lightblue;
                border: 1px solid rgb(3, 3, 5);
            }
            .container1{
                display: flex;
                flex-direction:row;
                justify-content: center;
                align-items:center;
                height: 100px;
                width:400px;
                border: 1px solid black;
                text-align: center;
                background-color: aqua;

            }
            .box1{
                width: 300px;
                height: 50px;
                background-color: lightblue;
                border: 1px solid rgb(3, 3, 5);
            }
            </style>
    </head>
    <body>
        <div class="container">
            <div class="box">box1</div>
            <div class="box">box2</div>
            <div class="box">box3</div>
        </div>
        <div class="container1">
            <div class="box1">box1</div>
            <div class="box1">box2</div>
        </div>
    </body>
</html>
