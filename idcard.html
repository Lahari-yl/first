<!DOCTYPE html>
<html>
<head>
    <title>Student ID Card</title>
    <link rel="stylesheet" href="idcard.css">
</head>
<body>

    <div class="card">

        <div class="header">
            <h2>ABC COLLEGE</h2>
            <p>Student Identity Card</p>
        </div>

        <div class="photo">
            <img src="favicon.jpg" alt="Student Photo">
        </div>

        <div class="details">
            <h3>Student Name</h3>
            <p><b>ID:</b> 101</p>
            <p><b>Course:</b> B.Tech CSE</p>
            <p><b>Year:</b> 2026</p>
            <p><b>Email:</b> student@gmail.com</p>
        </div>

        <div class="footer">
            <p>Valid Until: 2027</p>
        </div>

    </div>
</body>
</html>
