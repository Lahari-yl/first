<!DOCTYPE html>
<html>
    <head>
        <title>button</title>
        <style>
            button:hover{
                background-color: green;
            }
            button{
                background-color: blue;
                color:black;
                width:20%;
                height:20%;
            }
            #btn{
                text-align: right;
            }
            p::first-line{
                color: red;
            }
            body{
                background-image: url(favicon.jpg);
                background-repeat: no-repeat;
                background-size: 50% 50%;
                background-position: center;
                height: 500px;
                width: 700px;
                margin: 20px;
                background-color: aqua;
            }
            p{
                text-transform: capitalize;
            }
        </style>
    </head>
    <body>
        <div>
            <button>Click Me</button>
        </div>
        <div id="btn">
            <button>Submit</button>
        </div>
        <p>This is a paragraph with a red first letter.<br>
        this is second line.</p>
        <h2>this is heading</h2>
    </body>
    
</html>
