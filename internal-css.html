<!DOCTYPE html>
<html>
    <head>
        <title>Inline CSS Example</title>
        <style>
            h1 {
                color: blue;
                font-style: italic;
                text-align: center;
            }
            p {
                font-size: 16px;
                color: gray;
            }</style>
    </head>
    <body>
        <h1>Welcome to Inline CSS Example</h1>
        <p>This is an example of using internal CSS to style HTML elements.</p>
    </body>
</html>
