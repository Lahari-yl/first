<!DOCTYPE html>
<html>
    <head>
        <title>Inline CSS Example
        </title>
    </head>
    <body>
        <h1 style="color: blue; text-align: center;">Welcome to Inline CSS Example</h1>
        <p style="font-size: 16px; color: gray;">This is an example of using inline CSS to style HTML elements directly within the HTML tags.</p>
        <button style="background-color: green; color: white; padding: 10px 20px; border: none; cursor: pointer;">Click Me</button>
    </body>
</html>
