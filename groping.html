<!DOCTYPE html>
<html>
    <head>
        <title>grouping</title>
        <style>
            /* grouping elements are used to apply the css style to the group of elementsat once*/
            h1,h2,p{
                color: blue;
                text-align: center;
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <p>Paragraph</p>

    </body>
</html>
