<!DOCTYPE html>
<html>
    <head>
        <title>box</title>
        <style>
            .box{
                background-color: lightgray;
                width: 700px;
                height: 200px;
                padding: 20px;
                border: 5px solid black;
                margin: 10px;
                text-align: center;
                display:flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
            }
            .box1{
                background-color: lightblue;
                width: 300px;
                height: 100px;
                padding: 20px;
                border: 5px solid black;
                margin: 10px;
                text-align: center;
                display:flex;
            }
            .box2{
                background-color: lightcoral;
                width: 300px;
                height: 100px;
                padding: 20px;
                border: 5px solid black;
                margin: 10px;
                text-align: center;
                display:flex;
            }
            div{
                display: flex;
                align-items: center;
            }
            .p1{
                background-color:yellow;
            }
            .box3 {
                background-color: lightgreen;
                width: 700px;
                height: 20px;
                padding: 10px;
                border: 2px solid black;
                text-align: center;
            }

        </style>
    </head>
    <body>
        <div class="box">
            <div class="p">paragraph</div>
            <p class="p1">paragraph 1</p>
            <div class="p2">paragraph 2</div>
        </div>
        <div>
        <div class="box1">
            <div class="c2">logo 1</div>
        </div>
        <div class="box2">
            <div class="c3">logo 2</div>
        </div>
        </div>
        <div class="box3">
            <div class="p">final</div>
        </div>
    </body>
    </html>
