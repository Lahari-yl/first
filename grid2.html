<!DOCTYPE html>
<html>
    <head>
        <title>grid</title>
        <style>
            .con{
                display: grid;
                gap:5px;
                width: 300px;
                height: 150px;
            }
            .p{
                background-color: burlywood;
                border: 2px solid black;
                grid-column:1/3;
            }
        </style>
    </head>
    <body>
        <div class="con" style="background-color: aquamarine;color: black;">
            <div class="p">p1</div>
            <div class="p">p2</div>
            <div class="p">p3</div>
            <div class="p">p4</div>
        </div>
    </body>
</html>
