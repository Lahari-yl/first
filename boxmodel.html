<!DOCTYPE html>
<html>
    <head>
        <title>boxmodels</title>
        <style>
            div{
                background-color: lightgray;
                width: 600px;
                height: 200px;
                padding: 20px;
                border: 5px solid black;
                margin: 10px;
                text-align: center;
                display:flex
            }
            h4{
                height: 30px;
                width: 100px;
                padding: 10px;
                border: 2px solid black;
                background-color: lightblue;
                margin-top: 0px;
            }
            h5{
                height: 30px;
                width: 100px;
                padding: 10px;
                border: 2px solid black;
                background-color: lightcoral;
            }
            #box1{
                height:50px;
                width:100px;
                background-color: lightgreen;
                box-sizing: content-box;
                min-width: 300px;
                min-height: 50px;
                border: 2px solid black;
                text-align: center;
                
            }
            #box2{
                height:50px;
                width:100px;
                background-color: rgb(29, 116, 145);
                box-sizing: border-box;
                min-width: 300px;
                min-height: 50px;
                border:2px solid black;
                text-align: center;
            }
            #box{
                display: flex;
                justify-content: right;
                align-items: center;
            }

        </style>
    </head>
    <body>
        <div>
            <h3>Hello</h3>
            <h4>welcome</h4>
            <h5>css</h5>
            <p style="background-image: url(favicon.jpg);background-repeat: no-repeat;background-position: center;height: 50%;width: 50%;padding: 10px;border: 2px solid black;align-items: right;">Image</p>
        </div>
        <div id="box">
            <h1 id="box1">this is box1 used for min width and height

            </h1>
            <h2 id="box2">this is box2 used for minimum width and height

            </h2>
        </div>
        
    </body>
</html>
